# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Australia/Brisbane
    # Wait before adopting new releases, so compromised or broken releases
    # are usually caught and yanked first.
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: chore(deps)
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Australia/Brisbane
    cooldown:
      default-days: 7
      semver-major-days: 14
    # This is a library: keep the lower bounds in pyproject.toml as they are
    # (Home Assistant pins its own versions) and only update uv.lock, unless a
    # new release falls outside the allowed range.
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 10
    labels: [dependencies]
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      runtime:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
